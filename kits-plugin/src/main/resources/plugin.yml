name: LegendaryKits
version: '1.0.0'
main: io.github.legendarykits.LegendaryKits
api-version: '1.21.11'
commands:
  kits:
    description: Browse and edit kits
    aliases: [kit, legendarykits]
    usage: /kits [create <name> | <name> | cooldown <name> <seconds> | permission <name> <node|none>]
permissions:
  legendarykits.use:
    default: true
  legendarykits.admin:
    default: op
