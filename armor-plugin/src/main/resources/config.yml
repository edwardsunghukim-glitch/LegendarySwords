# Wear all four matching pieces to unlock passives and sneak + F abilities.
abilities-enabled: true
pvp: true
friendly-fire: false
# Fitted observer-only armor models. Turn off for texture-only rendering.
rendering-version: 3
accessories-enabled: true
# Extra cosmetic parts are always hidden from the wearer in this version.
accessories-visible-to-owner: false
# Default armor protection uses real netherite stats and normal armor damage reduction.
unbreakable: true
sets:
  angel:
    flight-enabled: true
    cooldown-seconds: 28
    damage: 8
    healing: 6
    passive-healing: 1
  dragon:
    flight-enabled: true
    cooldown-seconds: 24
    damage: 4
    fire-seconds: 4
  leviathan:
    flight-enabled: true
    cooldown-seconds: 25
    damage: 14
    speed-bonus: 0.08
  stone:
    cooldown-seconds: 30
    damage: 20
    damage-reduction: 0.12
    knockback-resistance: 0.35
  frost:
    cooldown-seconds: 28
    damage: 5
    slow-seconds: 4

# Double-jump wing power: cooldown starts when the wing duration ends.
wings:
  duration-seconds: 45
  cooldown-seconds: 90
