# Paper 1.21.11 / Java 21. Damage numbers are health points (2 points = 1 heart).
pvp-enabled: false
glow-particles: true
bettermodel:
  enabled: true
  install-bundled-models: true
  # Animate casts only; keep normal player movement, ordinary swings and idle poses.
  # Missing keys in existing configurations also default to true.
  abilities-only: true
  # Temporary character animation during abilities/ultimates; restored at cast/scene end.
  # Set false to use only attack effects if an equipment disconnect recurs.
  cast-body-animations: true
  # Legacy full-body locomotion mode only (used when abilities-only is false).
  # Keep false for normal walking/running and poses outside casts.
  player-body-animations: false
# Multipliers apply to each sword's configured damage, including existing configs.
# Armor, protection enchantments and resistance still reduce the final damage.
damage:
  ability-multiplier: 1.5
  ultimate-multiplier: 2.0
ultimates:
  # 1 = normal windup; 2 = twice as fast; 0.5 = half speed.
  # Optional swords.<sword_id>.ultimate-speed overrides this for one sword.
  speed: 1.0
charge:
  per-melee-hit: 10
  melee-kill-bonus: 20
cinematics:
  # Shared charge/reveal scene, then ultimate impact. Players keep position/game mode.
  enabled: true
  # Base windup before the ultimate speed multiplier is applied.
  # New key also shortens windups when updating an older configuration.
  windup-ticks: 24
resource-pack:
  # Host the exported resource-pack.zip at a direct HTTPS download URL.
  # An empty URL leaves automatic pack delivery off. Players can also install it locally.
  url: ''
  # Optional 40-character SHA-1; blank uses the bundled pack's computed hash.
  # Set this explicitly if you upload a merged or modified pack.
  sha1: ''
  required: false
  send-on-join: true
  join-delay-ticks: 60
