name: LegendaryAdmin
version: '0.1.2'
main: io.github.legendaryadmin.LegendaryAdmin
api-version: '1.21.11'
description: Moderation commands, vanish, read-only inventory viewer and admin menu.
commands:
  legendaryadmin:
    aliases: [la, ladmin]
    description: Admin tools and menu
    usage: /la help
  adminmenu:
    description: LegendaryAdmin adminmenu
  adminhelp:
    description: LegendaryAdmin adminhelp
  kick:
    description: LegendaryAdmin kick
  ban:
    description: LegendaryAdmin ban
  unban:
    description: LegendaryAdmin unban
  mute:
    description: LegendaryAdmin mute
  freeze:
    description: LegendaryAdmin freeze
  heal:
    description: LegendaryAdmin heal
  feed:
    description: LegendaryAdmin feed
  fly:
    description: LegendaryAdmin fly
  gm:
    description: LegendaryAdmin gm
    aliases: [gamemode]
  tp:
    description: LegendaryAdmin tp
  tphere:
    description: LegendaryAdmin tphere
  vanish:
    description: LegendaryAdmin vanish
  invsee:
    description: LegendaryAdmin invsee
  ecsee:
    description: View an online player ender chest (read only)
permissions:
  legendaryadmin.admin:
    default: op
    children:
      legendaryadmin.menu: true
      legendaryadmin.kick: true
      legendaryadmin.ban: true
      legendaryadmin.unban: true
      legendaryadmin.mute: true
      legendaryadmin.freeze: true
      legendaryadmin.heal: true
      legendaryadmin.feed: true
      legendaryadmin.fly: true
      legendaryadmin.gamemode: true
      legendaryadmin.teleport: true
      legendaryadmin.vanish: true
      legendaryadmin.invsee: true
      legendaryadmin.ecsee: true
      legendaryadmin.see-vanished: true
  legendaryadmin.menu: {default: op}
  legendaryadmin.kick: {default: op}
  legendaryadmin.ban: {default: op}
  legendaryadmin.unban: {default: op}
  legendaryadmin.mute: {default: op}
  legendaryadmin.freeze: {default: op}
  legendaryadmin.heal: {default: op}
  legendaryadmin.feed: {default: op}
  legendaryadmin.fly: {default: op}
  legendaryadmin.gamemode: {default: op}
  legendaryadmin.teleport: {default: op}
  legendaryadmin.vanish: {default: op}
  legendaryadmin.invsee: {default: op}
  legendaryadmin.ecsee: {default: op}
  legendaryadmin.see-vanished: {default: op}
