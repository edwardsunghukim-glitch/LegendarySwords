    passive-healing: 1
  dragon:
    cooldown-seconds: 24
    damage: 4
    fire-seconds: 4
  leviathan:
    cooldown-seconds: 25
    damage: 14
    speed-bonus: 0.08
  stone:
    cooldown-seconds: 30
    damage: 20
    damage-reduction: 0.12
    knockback-resistance: 0.35
  frost:
    cooldown-seconds: 28
    damage: 5
    slow-seconds: 4
