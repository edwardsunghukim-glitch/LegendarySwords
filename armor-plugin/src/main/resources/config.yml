pvp: true
friendly-fire: false
accessories-enabled: true
# Turn off if a cosmetic obstructs your view with a particular client/camera mod.
accessories-visible-to-owner: true
# Default armor protection uses real netherite stats and normal armor damage reduction.
unbreakable: true
