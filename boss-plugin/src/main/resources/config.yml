# Health is in hearts: 100 hearts = 200 health points.
health-hearts: 100
# Stronger attacks; applies on top of each boss damage value.
outgoing-damage-multiplier: 1.5
# 0.35 means bosses take 35% of incoming damage; 1.0 restores full damage.
incoming-damage-multiplier: 0.35
# Cap each incoming hit AFTER the multiplier, BEFORE native armor reduction.
# 10 health points = at most 5 hearts before armor. Applies to the actual mob.
max-damage-per-hit: 10
max-active-bosses: 5
target-range: 40
leash-range: 64
# Bosses are removed after this time; administrative removal never drops rewards.
lifetime-seconds: 1800
# Only a player kill awards one random matching piece.
require-player-kill: true
bosses:
  angel:
    model: legendaryswords_angel_sovereign_boss
    scale: 1.5
    flying: true
    flight-height: 5
    damage: 12
    attack-cooldown-seconds: 4
  dragon:
    model: legendaryswords_infernal_dragon_boss
    scale: 1.5
    flying: true
    flight-height: 5
    damage: 16
    attack-cooldown-seconds: 4
  leviathan:
    model: legendaryswords_sky_leviathan_boss
    scale: 1.5
    flying: true
    flight-height: 5
    damage: 14
    attack-cooldown-seconds: 4
  stone:
    model: legendaryswords_granite_colossus_boss
    scale: 1.3
    flying: false
    damage: 16
    attack-cooldown-seconds: 5
  frost:
    model: legendaryswords_frost_titan_boss
    scale: 1.5
    flying: false
    damage: 12
    attack-cooldown-seconds: 4

spawn-protection:
  enabled: true
  # WorldGuard region names; polygon and cuboid regions are supported.
  regions: [spawn]
  # Also protect this radius around each world's native spawn (0 disables fallback).
  world-spawn-radius: 16

# Native BetterModel hitboxes follow the animated body, wings and tail.
model-hitboxes: true

# Small model-local margin around each full body-part bound; scales with model.
hitbox-padding: 0.08
